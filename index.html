<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TermoOptik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,wght@0,300..900;1,300..900&family=Instrument+Serif:ital@0;1&family=Inter:wght@300..900&family=JetBrains+Mono:wght@300..800&family=Major+Mono+Display&family=Michroma&family=Monoton&family=Orbitron:wght@400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rubik+Mono+One&family=Space+Grotesk:wght@300..700&family=Syne:wght@400..800&family=Unbounded:wght@300..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b; --panel:#0d0f14; --panel2:#12151c; --line:#1f2430; --line2:#2a3140;
  --tx:#e7ecf3; --mute:#7d8799; --dim:#4b5466; --acc:#ff6a2b; --acc2:#3ad1ff;
  --mono:"JetBrains Mono", ui-monospace, monospace; --sans:"Inter", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.4 var(--sans);overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:1fr 340px;height:100vh}
/* stage */
.stage{position:relative;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-right:10px;display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffb100 30%,#ff3d00 60%,#5a00a8);box-shadow:0 0 12px #ff6a2b88}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#181c25;border-color:#3a4356}
.btn:active{transform:translateY(1px)}
.btn.hot{background:linear-gradient(90deg,#ff3d00,#ff8a1d);border-color:#ff8a1d;color:#120400;font-weight:600}
.btn.hot:hover{filter:brightness(1.1)}
.btn.cool{background:#0f2430;border-color:#1d4a60;color:#bfefff}
.btn kbd{font:10px var(--mono);opacity:.55}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
select.sel{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;cursor:pointer}
.canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:22px;min-height:0;position:relative;
  background-image:radial-gradient(#ffffff08 1px,transparent 1px);background-size:16px 16px}
#gl{display:block;box-shadow:0 30px 80px #000c,0 0 0 1px #ffffff10;background:#000}
.status{position:absolute;left:14px;bottom:10px;font:10px var(--mono);color:var(--dim);letter-spacing:.06em}
.drop{position:absolute;inset:10px;border:2px dashed var(--acc);border-radius:14px;display:none;align-items:center;justify-content:center;font:600 13px var(--mono);color:var(--acc);background:#07080bcc;z-index:5}
.drop.on{display:flex}
/* panel */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
.panel::-webkit-scrollbar{width:8px}.panel::-webkit-scrollbar-thumb{background:#232838;border-radius:4px}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:8px;font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#cfd6e2;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .chev{margin-left:auto;color:var(--dim);transition:transform .15s}
details.sec[open]>summary .chev{transform:rotate(90deg)}
.lock{border:1px solid var(--line2);background:transparent;border-radius:5px;padding:1px 6px;font:10px var(--mono);color:var(--dim);cursor:pointer;letter-spacing:0}
.lock.on{color:var(--acc);border-color:#6a2d14;background:#1d0f08}
.secbody{padding:2px 14px 14px;display:grid;gap:9px}
.row{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px}
.row label{color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font:10.5px var(--mono);color:#aeb8c8;text-align:right;background:transparent;border:none;width:44px;padding:0}
.row.full{grid-template-columns:96px 1fr}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--acc) var(--p,50%),#272d3b var(--p,50%))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#272d3b}
input[type=range]::-moz-range-progress{height:3px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#f3f5f8;margin-top:-4.5px;box-shadow:0 0 0 3px #0d0f14}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:#f3f5f8}
.row select,.row input[type=text],.row input[type=color]{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
.row input[type=color]{padding:1px;height:26px}
textarea{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:7px;width:100%;resize:vertical;min-height:54px;font:12px var(--sans)}
.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:var(--panel2);border:none;padding:5px 4px;cursor:pointer;color:var(--mute);font-size:11px}
.seg button.on{background:#2a1408;color:#ffb27f}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--mute)}
.sw input{accent-color:var(--acc)}
.pal{height:8px;border-radius:3px;margin-top:-3px}
.sub{font:600 10px var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:6px;display:flex;align-items:center;gap:8px}
.sub::after{content:"";flex:1;height:1px;background:var(--line)}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px;cursor:pointer;color:var(--mute)}
.tabs button.on{border-color:var(--acc);color:#ffd2b8}
.thumb{display:flex;align-items:center;gap:8px}
.thumb img,.thumb video{width:44px;height:44px;object-fit:cover;border-radius:5px;border:1px solid var(--line2)}
.prog{height:4px;background:#1b1f2a;border-radius:2px;overflow:hidden;display:none}
.prog>div{height:100%;width:0;background:linear-gradient(90deg,#ff3d00,#ffd25a)}
.note{font-size:10.5px;color:var(--dim);line-height:1.45}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#151924;border:1px solid var(--line2);padding:9px 14px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:20;font-size:12px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
@media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:55vh 1fr}.panel{border-left:none;border-top:1px solid var(--line)}html,body{overflow:auto}}
/* ===== Mockup studio ===== */
.studio{position:fixed;inset:0;z-index:30;background:#060709;display:flex;flex-direction:column}
.studio.hidden{display:none}
.st-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:#0a0c10}
.st-title{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-right:6px;display:flex;gap:8px;align-items:center}
.st-tabs{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:2px}
.st-tabs button{background:transparent;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mute)}
.st-tabs button.on{background:#24130a;color:#ffc09a}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 10px;cursor:pointer;color:var(--mute);display:inline-flex;gap:6px;align-items:center;font-size:11.5px;user-select:none}
.chip .box{width:11px;height:11px;border-radius:3px;border:1px solid #4a5366;display:inline-block}
.chip.on{border-color:#a6502a;color:#ffd8c2;background:#1c0e07}
.chip.on .box{background:var(--acc);border-color:var(--acc)}
.st-sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--mute)}
.st-sub .grp{display:flex;align-items:center;gap:6px}
.st-sub input[type=range]{width:140px}
.st-body{flex:1;overflow:auto;padding:22px}
.st-body::-webkit-scrollbar{width:9px}.st-body::-webkit-scrollbar-thumb{background:#232838;border-radius:4px}
.grid-fmt{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;justify-content:center}
.fcard{display:flex;flex-direction:column;gap:8px}
.fcard .cvbox{position:relative;box-shadow:0 20px 60px #000b,0 0 0 1px #ffffff12;background:#000}
.fcard canvas{display:block;width:100%;height:100%}
.fcard .meta{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.fcard .meta b{font:600 11px var(--mono);letter-spacing:.06em}
.fcard .meta span{color:var(--dim);font:10.5px var(--mono)}
.safe{position:absolute;inset:0;pointer-events:none;display:none}
.show-safe .safe{display:block}
.safe .m{position:absolute;border:1px dashed #3ad1ffaa}
.safe .band{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#ff6a2b22 0 6px,transparent 6px 12px);border-color:#ff6a2b66;border-style:dashed;border-width:0}
.cat{margin:6px auto 30px;max-width:1500px}
.cat h3{font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#cdd5e2;margin:0 0 12px;display:flex;gap:10px;align-items:center}
.cat h3::after{content:"";flex:1;height:1px;background:var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}
.mcard{background:#0c0e13;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.mcard canvas{width:100%;display:block;cursor:zoom-in;aspect-ratio:4/3}
.mcard .ft{display:flex;align-items:center;gap:8px;padding:9px 11px;flex-wrap:wrap}
.mcard .ft .nm{font-weight:600;margin-right:auto}
.mcard select{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;font-size:11px}
.focus{position:fixed;inset:0;z-index:40;background:#040506;display:flex;flex-direction:column}
.focus.hidden{display:none}
.focus .fh{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.focus .fh .nm{font-weight:600;margin-right:auto;font-size:13px}
.focus .vp{flex:1;overflow:hidden;position:relative;cursor:grab}
.focus .vp.drag{cursor:grabbing}
.focus .vp canvas{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 30px 90px #000}
.zoomv{font:11px var(--mono);color:var(--mute);min-width:44px;text-align:center}
.busyov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06070999;font:12px var(--mono);color:#ffc09a;z-index:3}

</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <div class="topbar">
      <div class="brand"><i></i>TermoOptik</div>
      <button class="btn" id="playBtn" title="Espaço">❚❚ <span>Pausa</span></button>
      <div class="sep"></div>
      <button class="btn cool" id="rndLight" title="R">✦ Randomizar leve <kbd>R</kbd></button>
      <button class="btn hot" id="rndHard" title="Shift+R">✸ Randomizar agressivo <kbd>⇧R</kbd></button>
      <button class="btn" id="undoBtn" title="Ctrl+Z">↶ Desfazer</button>
      <div class="sep"></div>
      <select class="sel" id="presetSel"><option value="">Presets…</option></select>
      <div class="sep"></div>
      <button class="btn hot" id="mockBtn" title="Adaptar a vários formatos e ver em mockups" style="background:linear-gradient(90deg,#3ad1ff,#8a5cff);border-color:#8a5cff;color:#06070a">▣ Testar em Mockup</button>
      <div class="sep"></div>
      <button class="btn" id="savePreset" title="Guardar parâmetros (.json)">⤓ JSON</button>
      <label class="btn" title="Carregar parâmetros (.json)">⤒ JSON<input type="file" id="loadPreset" accept=".json,application/json" hidden></label>
    </div>
    <div class="canvasWrap" id="wrap">
      <canvas id="gl"></canvas>
      <div class="drop" id="drop">Larga a imagem, vídeo ou fonte aqui</div>
      <div class="status" id="status"></div>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================================================================
   PALETTES
   ================================================================ */
const PALETTES = {
  "Ironbow":      ["#000000","#1d0a5a","#6a0c8f","#b8227a","#e8492e","#f98f0a","#fcd23b","#ffffff"],
  "Rainbow HC":   ["#000000","#2a0a7a","#0050ff","#00d0ff","#00ff6a","#e8ff00","#ff7b00","#ff0000","#ffffff"],
  "White Hot":    ["#000000","#ffffff"],
  "Black Hot":    ["#ffffff","#000000"],
  "Arctic":       ["#000010","#0a1a5c","#1f5fd6","#61b9ff","#e9f6ff","#ffc58a","#ffffff"],
  "Lava":         ["#000000","#3a0000","#a01000","#ff5a00","#ffd25a","#ffffff"],
  "Predator":     ["#00000a","#001a40","#003a1a","#00a03a","#d8ff3a","#ff3a00","#ffffff"],
  "Neon Drift":   ["#000000","#0c1640","#2d5db0","#c21fb7","#ff4fa8","#ff8a1d","#ffd09a"],
  "Vitrium":      ["#000000","#06123a","#1446c8","#27d3e6","#e8fbff","#ff8a3c","#c0261a"],
  "Glacier":      ["#000006","#02123d","#0a3aa8","#2a7bff","#8ec9ff","#f3f7ff","#ffd9c4"],
  "Silk Sunset":  ["#04061c","#10207a","#3a6ce0","#8fb6ff","#f0a77a","#c4504a","#2a0f20"],
  "Acid":         ["#000000","#0a2a00","#3cff00","#f0ff6a","#ffffff"],
  "Infravermelho":["#000000","#300018","#8a0030","#ff2850","#ff9db0","#ffffff"],
  "Mono":         ["#000000","#3a3a3a","#9a9a9a","#ffffff"]
};
const PAL_NAMES = Object.keys(PALETTES);

const FONTS = ["Instrument Serif","Inter","Space Grotesk","Syne","Unbounded","Playfair Display","Bodoni Moda","Fraunces","DM Serif Display","Archivo Black","Anton","Bebas Neue","Major Mono Display","JetBrains Mono","Michroma","Orbitron","Monoton","Rubik Mono One"];

const FORMATS = {
  "4:5 · 1080×1350":[1080,1350], "9:16 · 1080×1920":[1080,1920], "1:1 · 1080×1080":[1080,1080],
  "16:9 · 1920×1080":[1920,1080], "Poster A · 1240×1754":[1240,1754], "2:3 · 1200×1800":[1200,1800], "Banner 3:1 · 1800×600":[1800,600]
};

/* ================================================================
   PARAM SCHEMA  (sec: section id; r: aggressive random range)
   ================================================================ */
const P = [];
function num(sec,key,label,min,max,step,def,o={}){P.push({type:"num",sec,key,label,min,max,step,def,...o})}
function sel(sec,key,label,opts,def,o={}){P.push({type:"sel",sec,key,label,opts,def,...o})}
function tog(sec,key,label,def,o={}){P.push({type:"tog",sec,key,label,def,...o})}

// Fonte gerativa
tog("gen","genOn","Ativa",true,{norand:true});
sel("gen","fieldType","Campo",["Blobs","Arco","Anéis","Seda","Fluxo"],"Arco");
num("gen","blobCount","Elementos",1,8,1,3);
num("gen","fieldScale","Escala",0.3,3,0.01,1.0,{r:[0.5,2.2]});
num("gen","softness","Suavidade",0.05,1,0.01,0.55);
num("gen","fieldWarp","Distorção",0,2,0.01,0.35,{r:[0,1.2]});
num("gen","fieldGain","Intensidade",0,2,0.01,0.85,{r:[0.5,1.3]});
num("gen","fieldCurve","Curva",0.3,3,0.01,1.3,{r:[0.8,2.2]});
num("gen","motion","Movimento",0,3,1,1);
num("gen","posX","Posição X",-0.6,0.6,0.01,0.1);
num("gen","posY","Posição Y",-0.6,0.6,0.01,0.0);
sel("gen","palSrc","Paleta",PAL_NAMES,"Neon Drift");
num("gen","seed","Seed",0,999,1,42);

// Imagem
sel("img","imgMode","Mistura",["Misturar","Ecrã","Multiplicar","Somar","Calor"],"Misturar");
num("img","imgMix","Opacidade",0,1,0.01,1);
num("img","imgScale","Escala",0.3,3,0.01,1);
num("img","imgX","Offset X",-0.5,0.5,0.005,0);
num("img","imgY","Offset Y",-0.5,0.5,0.005,0);
sel("img","imgFit","Ajuste",["Cobrir","Conter"],"Cobrir",{norand:true});

// Tipografia (numéricos globais)
num("type","textHeat","Calor do texto",0,2,0.01,0.9,{r:[0.4,1.6]});
num("type","textAlpha","Opac. afetado",0,1,0.01,1,{norand:true});

// Motion blur
sel("blur","blurType","Tipo",["Linear","Zoom","Rotação","Turbulento"],"Linear");
num("blur","blurAmt","Quantidade",0,0.6,0.001,0.12,{r:[0,0.45]});
num("blur","blurAngle","Ângulo",0,360,1,90);
num("blur","blurSamples","Amostras",4,64,1,40,{norand:true});
num("blur","blurTrail","Rasto",0,1,0.01,0.0);
num("blur","blurCx","Centro X",0,1,0.01,0.5);
num("blur","blurCy","Centro Y",0,1,0.01,0.5);
num("blur","warpAmt","Líquido",0,0.25,0.001,0.0,{r:[0,0.12]});
num("blur","warpScale","Escala líquido",0.5,10,0.1,2.5);

// Vidro canelado
sel("glass","glassType","Vidro",["Nenhum","Canelado","Anéis","Ondulado"],"Canelado");
num("glass","glassCount","Nº de canais",2,90,1,22,{r:[6,60]});
num("glass","glassRefract","Refração",-3,3,0.01,1.1);
num("glass","glassAngle","Ângulo",0,180,1,0);
num("glass","glassJitter","Desvio",0,1,0.01,0.25);
num("glass","glassShift","Desalinho Y",0,0.3,0.001,0.04,{r:[0,0.15]});
num("glass","glassEdge","Arestas",0,1,0.01,0.35);
num("glass","glassDisp","Dispersão",0,0.08,0.001,0.012,{r:[0,0.05]});
num("glass","glassDrift","Ondulação",0,4,1,1);
num("glass","glassCx","Centro X",0,1,0.01,0.5);
num("glass","glassCy","Centro Y",0,1,0.01,0.5);

// Câmara termal
num("thermal","thermalMix","Mistura termal",0,1,0.01,0.0,{r:[0,1]});
sel("thermal","palThermal","Paleta",PAL_NAMES,"Ironbow");
sel("thermal","heatSrc","Fonte de calor",["Luminância","Campo"],"Luminância");
num("thermal","tLow","Mín.",0,1,0.01,0.05,{r:[0,0.35]});
num("thermal","tHigh","Máx.",0,1,0.01,0.95,{r:[0.6,1]});
num("thermal","tGamma","Gama",0.3,3,0.01,1.0,{r:[0.5,2]});
num("thermal","tLevels","Isotermas",0,24,1,0);
num("thermal","tEdges","Contornos",0,3,0.01,0.0,{r:[0,1.5]});
num("thermal","tNoise","Ruído sensor",0,0.3,0.001,0.0,{r:[0,0.12]});
num("thermal","scanlines","Scanlines",0,1,0.01,0.0,{r:[0,0.6]});
tog("thermal","hud","HUD câmara",false);

// Acabamento
num("post","glow","Glow",0,2,0.01,0.35,{r:[0,1.3]});
num("post","glowRadius","Raio glow",1,7,0.1,4.5);
num("post","ca","Aberração",0,0.03,0.0005,0.002,{r:[0,0.015]});
num("post","exposure","Exposição",-2,2,0.01,0.0,{r:[-0.6,0.8]});
num("post","contrast","Contraste",0.5,2,0.01,1.08,{r:[0.8,1.5]});
num("post","saturation","Saturação",0,2,0.01,1.1,{r:[0.6,1.6]});
num("post","grain","Grão",0,0.5,0.001,0.09,{r:[0,0.25]});
num("post","grainSize","Tamanho grão",1,4,0.1,1.4);
num("post","vignette","Vinheta",0,1,0.01,0.35);

// Animação
num("anim","loopDur","Duração loop (s)",2,20,0.5,8,{norand:true});
num("anim","speedMul","Velocidade",0,3,0.01,1,{norand:true});

const SECTIONS = [
  ["gen","Fonte gerativa"],["img","Imagem / vídeo"],["type","Tipografia"],["blur","Motion blur"],

  let x,y;
  if(same){x=L.x*W;y=L.y*H}
  else{
    x = L.align==="center" ? L.x*W : (L.x<=0.5 ? L.x*RW*k : W-(1-L.x)*RW*k);
    y = L.y<=0.5 ? L.y*RH*k : H-(1-L.y)*RH*k;
    if(Math.abs(L.rot)<1){
      const m=Math.min(W,H)*0.04;
      const mw=Math.max(1,...lines.map(l=>ctx.measureText(l).width));
      const avail = L.align==="left"?W-x-m : L.align==="right"?x-m : Math.min(x,W-x)*2-2*m;
      const f=Math.min(1,Math.max(0.05*mw,avail)/mw);
      const bh=()=>px*0.8+(lines.length-1)*px*L.leading+px*0.25;
      if(f<1){px*=f;setF()}
      if(bh()>H-2*m){px*=(H-2*m)/bh();setF()}
      if(y+bh()>H-m)y=H-m-bh();
      if(y<m*0.5)y=m*0.5;

  ctx.save(); ctx.translate(x,y); ctx.rotate(L.rot*Math.PI/180);

function drawHUD(ctx,W,H,theta){
  const u=Math.sqrt(W*H)/1160, c="rgba(255,255,255,.88)";

  const m=40*u, L=46*u;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.beginPath();ctx.moveTo(x,y+L*sy);ctx.lineTo(x,y);ctx.lineTo(x+L*sx,y);ctx.stroke()});
  const cx=W/2,cy=H/2,r=22*u;
  ctx.beginPath();ctx.moveTo(cx-r*2,cy);ctx.lineTo(cx-r*.6,cy);ctx.moveTo(cx+r*.6,cy);ctx.lineTo(cx+r*2,cy);
  ctx.moveTo(cx,cy-r*2);ctx.lineTo(cx,cy-r*.6);ctx.moveTo(cx,cy+r*.6);ctx.lineTo(cx,cy+r*2);ctx.stroke();
  ctx.font=`500 ${15*u}px "JetBrains Mono"`;ctx.textBaseline="top";
  const lo=18+S.tLow*20, hi=lo+14+S.tHigh*14, mid=(lo+hi)/2+Math.sin(theta)*1.2;
  ctx.textAlign="left"; ctx.fillText(`SP1 ${mid.toFixed(1)}°C`,cx+r*1.1,cy+r*1.1);
  ctx.fillText("● REC",m+8*u,m+10*u);
  ctx.textAlign="right"; ctx.fillText(`ε 0.95   ${S.palThermal.toUpperCase()}`,W-m-8*u,m+10*u);
  const t=Math.floor(theta/(Math.PI*2)*S.loopDur*100);
  ctx.fillText(`00:${String(Math.floor(t/100)%60).padStart(2,"0")}:${String(t%100).padStart(2,"0")}`,W-m-8*u,H-m-26*u);
  // scale bar
  const bw=14*u, bh=H*0.32, bx=W-m-bw, by=H/2-bh/2;
  const g=ctx.createLinearGradient(0,by+bh,0,by);const st=PALETTES[S.palThermal];st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s));
  ctx.fillStyle=g;ctx.fillRect(bx,by,bw,bh);ctx.strokeRect(bx,by,bw,bh);ctx.fillStyle=c;
  ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillText(hi.toFixed(1),bx-8*u,by);ctx.fillText(lo.toFixed(1),bx-8*u,by+bh);

}
function renderTextCanvases(W,H,theta){
  if(txtCv.width!==W||txtCv.height!==H){txtCv.width=W;txtCv.height=H;ovCv.width=W;ovCv.height=H;textDirty=true}
  if(textDirty){
    const a=txtCv.getContext("2d");a.clearRect(0,0,W,H);
    layers.forEach(L=>{ if(!L.on||L.mode==="nitido")return; a.fillStyle=L.color; drawLayer(a,L,W,H)});
    gl.bindTexture(gl.TEXTURE_2D,txtTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,txtCv);
  }
  if(textDirty||S.hud){

    layers.forEach(L=>{ if(!L.on||L.mode==="afetado")return; b.fillStyle=L.color; drawLayer(b,L,W,H)});

/* ---------- render ---------- */
function bindT(unit,tex,loc){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(loc,unit)}
const idx=(k)=>PBY[k].opts.indexOf(S[k]);
function common(u,W,H,theta,frame,scale){
  gl.uniform2f(u.uRes,W,H);gl.uniform1f(u.uTheta,theta);gl.uniform1f(u.uSeed,S.seed);
  gl.uniform1f(u.uFrame,frame);gl.uniform1f(u.uScale,scale);
  const [RW,RH]=FORMATS[fmtName]; const Ar=RW/RH, A=W/H;
  gl.uniform2f(u.uAsp,Math.sqrt(A*Ar),Math.sqrt(Ar/A)); gl.uniform1f(u.uAspRef,Ar);
}
function render(W,H,theta,frame,scale){
  ensureFBO(W,H);
  renderTextCanvases(W,H,theta);
  if(imgIsVideo&&imgEl&&imgEl.readyState>=2)uploadImg();
  gl.disable(gl.BLEND);
  // pass 1
  let {pr,u}=progScene; gl.useProgram(pr);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb.fA);gl.viewport(0,0,W,H);
  common(u,W,H,theta,frame,scale);
  gl.uniform1i(u.uGenOn,S.genOn?1:0);gl.uniform1i(u.uField,idx("fieldType"));gl.uniform1i(u.uCount,S.blobCount);
  gl.uniform1f(u.uFScale,S.fieldScale);gl.uniform1f(u.uSoft,S.softness);gl.uniform1f(u.uFWarp,S.fieldWarp);
  gl.uniform1f(u.uGain,S.fieldGain);gl.uniform1f(u.uCurve,S.fieldCurve);gl.uniform1f(u.uMotion,S.motion);
  gl.uniform2f(u.uPos,S.posX,S.posY);
  bindT(0,lutTex(S.palSrc),u.uPalSrc);
  bindT(1,imgTex,u.uImg);gl.uniform1i(u.uHasImg,hasImg?1:0);gl.uniform1i(u.uImgMode,idx("imgMode"));
  gl.uniform1f(u.uImgMix,S.imgMix);gl.uniform1f(u.uImgScale,S.imgScale);gl.uniform2f(u.uImgOff,S.imgX,S.imgY);
  const ca=W/H; let fx=1,fy=1; const cover=S.imgFit==="Cobrir";
  if((imgAspect>ca)===cover){fx=ca/imgAspect}else{fy=imgAspect/ca}
  gl.uniform2f(u.uImgFit,fx,fy);
  bindT(2,txtTex,u.uTxt);gl.uniform1f(u.uTextHeat,S.textHeat);gl.uniform1f(u.uTextAlpha,S.textAlpha);
  gl.drawArrays(gl.TRIANGLES,0,3);
  // pass 2
  ({pr,u}=progBlur); gl.useProgram(pr);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb.fB);
  common(u,W,H,theta,frame,scale);
  bindT(0,fb.A,u.uA);
  gl.uniform1i(u.uType,idx("blurType"));gl.uniform1i(u.uN,S.blurSamples);
  gl.uniform1f(u.uAmt,S.blurAmt);gl.uniform1f(u.uAng,S.blurAngle);gl.uniform1f(u.uTrail,S.blurTrail);
  gl.uniform1f(u.uWarp,S.warpAmt);gl.uniform1f(u.uWScale,S.warpScale);gl.uniform2f(u.uC,S.blurCx,S.blurCy);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindTexture(gl.TEXTURE_2D,fb.B);gl.generateMipmap(gl.TEXTURE_2D);
  // pass 3
  ({pr,u}=progFinal); gl.useProgram(pr);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
  common(u,W,H,theta,frame,scale);
  bindT(0,fb.B,u.uB);bindT(1,lutTex(S.palThermal),u.uPalT);bindT(2,ovTex,u.uOver);
  gl.uniform1i(u.uGlass,idx("glassType"));gl.uniform1f(u.uGCount,S.glassCount);gl.uniform1f(u.uGRef,S.glassRefract);
  gl.uniform1f(u.uGAng,S.glassAngle);gl.uniform1f(u.uGJit,S.glassJitter);gl.uniform1f(u.uGShift,S.glassShift);
  gl.uniform1f(u.uGEdge,S.glassEdge);gl.uniform1f(u.uGDisp,S.glassDisp);gl.uniform1f(u.uGDrift,S.glassDrift);
  gl.uniform2f(u.uGC,S.glassCx,S.glassCy);
  gl.uniform1f(u.uTMix,S.thermalMix);gl.uniform1f(u.uTLow,S.tLow);gl.uniform1f(u.uTHigh,S.tHigh);gl.uniform1f(u.uTGamma,S.tGamma);
  gl.uniform1f(u.uTLevels,S.tLevels);gl.uniform1f(u.uTEdges,S.tEdges);gl.uniform1f(u.uTNoise,S.tNoise);gl.uniform1f(u.uScan,S.scanlines);
  gl.uniform1i(u.uHeatSrc,idx("heatSrc"));
  const mipMax=Math.floor(Math.log2(Math.max(W,H)));
  gl.uniform1f(u.uGlow,S.glow);gl.uniform1f(u.uGlowR,Math.min(S.glowRadius+Math.log2(scale),mipMax-1.5));gl.uniform1f(u.uCA,S.ca);
  gl.uniform1f(u.uExpo,S.exposure);gl.uniform1f(u.uContr,S.contrast);gl.uniform1f(u.uSat,S.saturation);
  gl.uniform1f(u.uGrain,S.grain);gl.uniform1f(u.uGrainSz,S.grainSize);gl.uniform1f(u.uVig,S.vignette);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

const wrap=document.getElementById("wrap");
let playing=true, theta=0, frame=0, last=performance.now(), busy=false, previewQ=1;
let pw=0,ph=0,pscale=1;
function layoutPreview(){
  const [FW,FH]=FORMATS[fmtName];
  const r=wrap.getBoundingClientRect(); const aw=r.width-44, ah=r.height-44;
  const s=Math.min(aw/FW,ah/FH); const cw=Math.max(50,Math.floor(FW*s)), ch=Math.max(50,Math.floor(FH*s));
  cv.style.width=cw+"px";cv.style.height=ch+"px";
  const dpr=Math.min(window.devicePixelRatio||1,2)*previewQ;
  pw=Math.round(cw*dpr);ph=Math.round(ch*dpr);
  pscale=ph/FH;
}
new ResizeObserver(()=>{layoutPreview()}).observe(wrap);
let fpsAcc=0,fpsN=0,fpsShow=0;
function tick(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(!busy){
    if(playing){theta=(theta+dt*S.speedMul*Math.PI*2/S.loopDur)%(Math.PI*2);frame++}
    if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph}
    render(pw,ph,theta,frame,pscale);
    fpsAcc+=dt;fpsN++; if(fpsAcc>0.5){fpsShow=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0;
      const [FW,FH]=FORMATS[fmtName];
      document.getElementById("status").textContent=`${FW}×${FH} · pré-vis. ${pw}×${ph} · ${fpsShow} fps · ${fb.float?"16-bit":"8-bit"}`;}
  }
  requestAnimationFrame(tick);
}

/* ================================================================
   RANDOMIZE + HISTORY
   ================================================================ */
const hist=[];
function snapshot(){return JSON.stringify({S,layers})}
function pushHist(){hist.push(snapshot());if(hist.length>60)hist.shift()}
function undo(){const s=hist.pop();if(!s)return toast("Nada para desfazer");const o=JSON.parse(s);Object.assign(S,o.S);layers=o.layers;sync()}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function quant(p,v){v=Math.round(v/p.step)*p.step;return Math.min(p.max,Math.max(p.min,+v.toFixed(4)))}
function randomize(aggr){
  pushHist();
  P.forEach(p=>{
    if(p.norand||locks[p.sec])return;
    if(p.type==="num"){
      if(aggr){const [a,b]=p.r||[p.min,p.max];S[p.key]=quant(p,rnd(a,b))}
      else{const span=(p.max-p.min)*(p.step>=1?0.12:0.08);S[p.key]=quant(p,S[p.key]+rnd(-span,span))}
    } else if(p.type==="sel"){
      if(aggr&&p.key!=="imgFit")S[p.key]=pick(p.opts);
      else if(!aggr&&(p.key==="palSrc"||p.key==="palThermal")&&Math.random()<0.12)S[p.key]=pick(p.opts);
    } else if(aggr&&p.key==="hud"){S.hud=Math.random()<0.25}
  });
  if(aggr&&!locks.gen)S.seed=Math.floor(Math.random()*1000);
  if(aggr){ // keep it beautiful: bias some choices
    if(!locks.thermal){S.thermalMix=Math.random()<0.45?0:quant(PBY.thermalMix,rnd(0.6,1)); if(S.tHigh-S.tLow<0.3)S.tHigh=Math.min(1,S.tLow+0.5)}
    if(!locks.glass&&Math.random()<0.15)S.glassType="Nenhum";
    if(!locks.blur&&Math.random()<0.25)S.blurAmt=quant(PBY.blurAmt,rnd(0,0.06));
  }
  sync();
}

let dl=null;

async function saveFile(blob,name){

const stamp=()=>{const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}${String(d.getSeconds()).padStart(2,"0")}`};
const even=n=>n%2?n-1:n;

async function exportStill(scale,fmt){
  if(busy)return;busy=true;
  const [FW,FH]=FORMATS[fmtName];let W=FW*scale,H=FH*scale;
  const lim=Math.min(MAXTEX,gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0],8192);
  if(W>lim||H>lim){const k=lim/Math.max(W,H);W=Math.floor(W*k);H=Math.floor(H*k);toast(`Limitado a ${W}×${H} pelo GPU`)}

let Mp4MuxerLib=null;
function loadMuxer(){
  if(window.Mp4Muxer)return Promise.resolve(window.Mp4Muxer);
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js";
    s.onload=()=>res(window.Mp4Muxer);s.onerror=rej;document.head.appendChild(s)});
}
async function exportVideo({fps,scale,loops,mbps,prog,btn}){
  if(busy)return;
  const [FW,FH]=FORMATS[fmtName];
  const W=even(Math.round(FW*scale)),H=even(Math.round(FH*scale));
  const total=Math.round(S.loopDur*loops*fps);
  busy=true;btn.disabled=true;prog.style.display="block";const bar=prog.firstChild;
  let cancelled=false;const old=btn.textContent;btn.textContent="A renderizar… (Esc cancela)";
  const onEsc=e=>{if(e.key==="Escape")cancelled=true};window.addEventListener("keydown",onEsc);
  cv.width=W;cv.height=H;textDirty=true;
  const wasVideoPlaying=imgIsVideo&&imgEl&&!imgEl.paused; if(wasVideoPlaying)imgEl.pause();
  const seekVid=async t=>{if(!(imgIsVideo&&imgEl))return;const d=imgEl.duration||1;imgEl.currentTime=t%d;
    await new Promise(r=>{const f=()=>{imgEl.removeEventListener("seeked",f);r()};imgEl.addEventListener("seeked",f);setTimeout(r,500)})};
  try{
    let ok=false;
    if("VideoEncoder" in window){
      let M=null;try{M=await loadMuxer()}catch(e){}
      const cands=["avc1.640034","avc1.640033","avc1.640032","avc1.640028","avc1.4d0034","avc1.42003e"];
      let cfg=null;
      if(M)for(const c of cands){const t={codec:c,width:W,height:H,bitrate:mbps*1e6*(scale>=2?1.6:1),framerate:fps,avc:{format:"avc"}};
        try{const s=await VideoEncoder.isConfigSupported(t);if(s.supported){cfg=t;break}}catch(e){}}
      if(cfg){
        const muxer=new M.Muxer({target:new M.ArrayBufferTarget(),video:{codec:"avc",width:W,height:H,frameRate:fps},fastStart:"in-memory"});
        let err=null;
        const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>err=e});
        enc.configure(cfg);
        const th0=theta;
        for(let i=0;i<total;i++){
          if(cancelled||err)break;
          const th=(th0+i/(S.loopDur*fps)*Math.PI*2)%(Math.PI*2);
          await seekVid(i/fps);
          render(W,H,th,i,H/FH);
          const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
          enc.encode(vf,{keyFrame:i%(fps*2)===0});vf.close();
          while(enc.encodeQueueSize>4)await new Promise(r=>setTimeout(r,1));
          if(i%3===0){bar.style.width=(i/total*100)+"%";await new Promise(r=>setTimeout(r,0))}
        }
        if(err)throw err;
        if(!cancelled){await enc.flush();muxer.finalize();enc.close();
          bar.style.width="100%";
          await saveFile(new Blob([muxer.target.buffer],{type:"video/mp4"}),`termooptik-${stamp()}-${W}x${H}.mp4`)}
        else{try{enc.close()}catch(e){};toast("Exportação cancelada")}
        ok=true;
      }
    }
    if(!ok){ // fallback: realtime MediaRecorder
      toast("WebCodecs indisponível — a gravar WebM em tempo real");
      const stream=cv.captureStream(fps);
      const mt=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(m=>MediaRecorder.isTypeSupported(m));
      const rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:mbps*1e6});const chunks=[];
      rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
      const done=new Promise(r=>rec.onstop=r);rec.start();
      const t0=performance.now(),th0=theta;
      await new Promise(res=>{const step=()=>{const el=(performance.now()-t0)/1000;
        if(el>=S.loopDur*loops||cancelled)return res();
        const th=(th0+el/S.loopDur*Math.PI*2)%(Math.PI*2);render(W,H,th,Math.floor(el*fps),H/FH);bar.style.width=(el/(S.loopDur*loops)*100)+"%";requestAnimationFrame(step)};step()});
      rec.stop();await done;
      if(!cancelled)await saveFile(new Blob(chunks,{type:"video/webm"}),`termooptik-${stamp()}-${W}x${H}.webm`);
    }
  }catch(e){console.error(e);toast("Erro no vídeo: "+(e.message||e))}
  finally{window.removeEventListener("keydown",onEsc);busy=false;btn.disabled=false;btn.textContent=old;
    setTimeout(()=>{prog.style.display="none";bar.style.width="0"},1200);cv.width=pw;cv.height=ph;textDirty=true;
    if(wasVideoPlaying)imgEl.play()}
}

const fmtDims = id => id==="orig" ? FORMATS[fmtName] : ADAPT.find(a=>a.id===id).dims;

  loopPos:null, safe:false, feed:{}, pkgScale:1, pkgMock:true, lo:{}, hi:{}, focus:null, prevBusy:false};

/* ---------- variant rendering (shares the main WebGL engine) ---------- */
function renderVariant(id, longSide){
  const [bw,bh]=fmtDims(id);
  const sc = longSide ? Math.min(longSide/Math.max(bw,bh), 4) : 1;
  const W=Math.max(2,Math.round(bw*sc)), H=Math.max(2,Math.round(bh*sc));
  cv.width=W; cv.height=H; textDirty=true;
  render(W,H,ST.theta,frame,H/bh);
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  c.getContext("2d").drawImage(cv,0,0);
  textDirty=true;
  return c;
}
function lo(id){ return ST.lo[id] || (ST.lo[id]=renderVariant(id,1100)); }
function hi(id){ return ST.hi[id] || (ST.hi[id]=renderVariant(id,0)); }
function refreshVariants(){
  ST.lo={}; ST.hi={}; avgCache.clear();
  ["916","45","11","169","orig"].forEach(lo);
}

/* ---------- 2D helpers ---------- */
const avgCache=new Map();
function avgColor(img){
  if(avgCache.has(img))return avgCache.get(img);
  const c=document.createElement("canvas");c.width=c.height=8;const x=c.getContext("2d");x.drawImage(img,0,0,8,8);
  const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}
  const n=d.length/4;const out=[r/n,g/n,b/n].map(v=>Math.round(v));
  const lum=(out[0]*.2126+out[1]*.7152+out[2]*.0722)/255;
  const boost=lum<0.25?0.25/Math.max(lum,0.02):1; // dark art still glows
  const res=out.map(v=>Math.min(255,Math.round(v*Math.min(boost,4))));
  avgCache.set(img,res);return res;
}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const NOISE=(()=>{const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const id=x.createImageData(256,256);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}
  x.putImageData(id,0,0);return c})();
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function cover(ctx,img,x,y,w,h){
  const ia=img.width/img.height, ba=w/h; let sw,sh,sx,sy;
  if(ia>ba){sh=img.height;sw=sh*ba;sx=(img.width-sw)/2;sy=0}else{sw=img.width;sh=sw/ba;sx=0;sy=(img.height-sh)/2}
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function grain(ctx,x,y,w,h,alpha,mode="overlay",S=1){

function closeStudio(){ST.open=false;studio.classList.add("hidden");focusEl.classList.add("hidden");busy=false;textDirty=true;cv.width=pw;cv.height=ph;ST.lo={};ST.hi={}}
$("#stClose").onclick=closeStudio;
$("#stRefresh").onclick=()=>withBusy("A renderizar…",()=>{ST.theta=+$("#stLoop").value*Math.PI*2;refreshVariants();setTab(ST.tab)});
studio.querySelectorAll(".st-tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
function segBind(id,key,after){const s=$(id);s.querySelectorAll("button").forEach(b=>b.onclick=()=>{s.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");ST[key]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;after&&after()})}
segBind("#stTheme","theme",()=>{if(ST.tab==="scene")drawScene();if(!focusEl.classList.contains("hidden"))drawFocus()});
segBind("#stFrame","frame",()=>{drawScene(["poster","gallery"]);if(!focusEl.classList.contains("hidden"))drawFocus()});
segBind("#stScale","pkgScale",()=>{if(ST.tab==="grid")drawGrid()});
$("#stSafe").onchange=e=>{ST.safe=e.target.checked;$("#stGrid").classList.toggle("show-safe",ST.safe)};
$("#stPkgMock").onchange=e=>{ST.pkgMock=e.target.checked};
let loopT;$("#stLoop").oninput=e=>{clearTimeout(loopT);loopT=setTimeout(()=>withBusy("A renderizar…",()=>{ST.theta=+e.target.value*Math.PI*2;refreshVariants();setTab(ST.tab)}),250)};
window.addEventListener("resize",()=>{if(ST.open&&ST.tab==="grid")drawGrid()});

/* ---------- focus view (zoom / pan) ---------- */
const F={i:0,z:1,x:0,y:0,c:null};
function openFocus(id){F.i=MOCKS.findIndex(m=>m.id===id);focusEl.classList.remove("hidden");drawFocus(true)}
function drawFocus(fit){
  const m=MOCKS[F.i];$("#fName").textContent=`${m.cat} · ${m.name}`;
  const fs=$("#fFeed");if(m.feed){fs.classList.remove("hidden");feedOptions(fs,ST.feed[m.id]??m.feed)}else fs.classList.add("hidden");
  const vp=$("#fVp");
  if(!F.c){F.c=document.createElement("canvas");F.c.width=2400;F.c.height=1800;vp.appendChild(F.c)}
  drawMock(m,F.c,"hi");
  if(fit!==false&&fit)fitFocus();else applyZ();
}
function fitFocus(){const vp=$("#fVp");const r=vp.getBoundingClientRect();F.z=Math.min((r.width-40)/2400,(r.height-40)/1800);F.x=(r.width-2400*F.z)/2;F.y=(r.height-1800*F.z)/2;applyZ()}
function applyZ(){F.c.style.transform=`translate(${F.x}px,${F.y}px) scale(${F.z})`;$("#fZoom").textContent=Math.round(F.z*2400/1600*100)+"%"}
function zoomAt(f,px,py){const nz=Math.min(4,Math.max(0.1,F.z*f));F.x=px-(px-F.x)*nz/F.z;F.y=py-(py-F.y)*nz/F.z;F.z=nz;applyZ()}
const vpEl=$("#fVp");
vpEl.addEventListener("wheel",e=>{e.preventDefault();const r=vpEl.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
let dragS=null;vpEl.addEventListener("pointerdown",e=>{dragS=[e.clientX-F.x,e.clientY-F.y];vpEl.classList.add("drag");vpEl.setPointerCapture(e.pointerId)});
vpEl.addEventListener("pointermove",e=>{if(dragS){F.x=e.clientX-dragS[0];F.y=e.clientY-dragS[1];applyZ()}});
vpEl.addEventListener("pointerup",()=>{dragS=null;vpEl.classList.remove("drag")});
vpEl.addEventListener("dblclick",e=>{const r=vpEl.getBoundingClientRect();zoomAt(2,e.clientX-r.left,e.clientY-r.top)});
const cz=f=>{const r=vpEl.getBoundingClientRect();zoomAt(f,r.width/2,r.height/2)};
$("#fIn").onclick=()=>cz(1.25);$("#fOut").onclick=()=>cz(0.8);$("#fFit").onclick=fitFocus;
$("#fPrev").onclick=()=>{F.i=(F.i+MOCKS.length-1)%MOCKS.length;drawFocus(true)};
$("#fNext").onclick=()=>{F.i=(F.i+1)%MOCKS.length;drawFocus(true)};
$("#fFeed").onchange=e=>{const m=MOCKS[F.i];ST.feed[m.id]=e.target.value;drawFocus(false);drawScene([m.id]);
  const s=mockCanvases[m.id]?.parentElement.querySelector("select");if(s)s.value=e.target.value};
$("#fClose").onclick=()=>focusEl.classList.add("hidden");
$("#fPng").onclick=()=>exportMock(MOCKS[F.i].id);
window.addEventListener("keydown",e=>{
  if(!ST.open)return;
  if(e.key==="Escape"){e.stopImmediatePropagation();if(!focusEl.classList.contains("hidden"))focusEl.classList.add("hidden");else closeStudio()}
  else if(!focusEl.classList.contains("hidden")){if(e.key==="ArrowRight")$("#fNext").click();if(e.key==="ArrowLeft")$("#fPrev").click()}
},true);

/* ---------- exports ---------- */
const toBlob=(c,t="image/png",q)=>new Promise(r=>c.toBlob(r,t,q));
async function renderFormatFull(id,scale){
  const [bw,bh]=fmtDims(id);const c=renderVariant(id,Math.max(bw,bh)*scale);return c;
}
async function mockFull(id){const m=MOCKS.find(x=>x.id===id);const c=document.createElement("canvas");c.width=3200;c.height=2400;drawMock(m,c,"hi");return c}
const slug=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function exportFormat(id){withBusy("A renderizar em alta resolução…",async()=>{const c=await renderFormatFull(id,ST.pkgScale);
  await saveFile(await toBlob(c),`termooptik-${id}-${c.width}x${c.height}-${stamp()}.png`)})}
function exportMock(id){const m=MOCKS.find(x=>x.id===id);withBusy("A renderizar mockup 3200×2400…",async()=>{const c=await mockFull(id);
  await saveFile(await toBlob(c),`termooptik-mockup-${slug(m.name)}-${stamp()}.png`)})}
let JSZipLib=null;
function loadZip(){if(window.JSZip)return Promise.resolve(window.JSZip);return new Promise((res,rej)=>{const s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=()=>res(window.JSZip);s.onerror=rej;document.head.appendChild(s)})}
$("#stPack").onclick=()=>withBusy("A montar o pacote multi-formato…",async()=>{
  let Z=null;try{Z=await loadZip()}catch(e){}
  const files=[];
  for(const id of ST.sel){const c=await renderFormatFull(id,ST.pkgScale);files.push([`formatos/termooptik-${id}-${c.width}x${c.height}.png`,await toBlob(c)])}
  if(ST.pkgMock)for(const m of MOCKS){const c=await mockFull(m.id);files.push([`mockups/${slug(m.cat)}/${slug(m.name)}.png`,await toBlob(c)])}
  if(Z){const zip=new Z();files.forEach(([n,b])=>zip.file(n,b));
    zip.file("parametros.json",JSON.stringify({app:"termooptik",v:2,format:fmtName,S,layers},null,1));
    const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
    await saveFile(blob,`termooptik-pacote-${stamp()}.zip`)}
  else{toast("Sem compressão disponível — a guardar ficheiro a ficheiro");for(const [n,b] of files){await saveFile(b,n.split("/").pop())}}
});
document.getElementById("mockBtn").onclick=openStudio;

buildUI();
Object.assign(S,PRESETS["Neon Drift"].S);sync();
layoutPreview();
requestAnimationFrame(tick);
</script>
</body>
</html>
